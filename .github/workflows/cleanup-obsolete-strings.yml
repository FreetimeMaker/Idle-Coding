name: Cleanup obsolete strings

on:
  push:
    branches:
      - fix/remove-obsolete-about-links

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-obsolete-about-links

      - name: Remove obsolete strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/res/values/strings.xml')
          text = path.read_text(encoding='utf-8')

          obsolete = {
              'settings_art_credits',
              'settings_art_credits_desc',
              'settings_credit_banners_subtitle',
              'settings_credit_banners_title',
              'settings_credit_bosses_subtitle',
              'settings_credit_bosses_title',
              'settings_credit_characters_subtitle',
              'settings_credit_characters_title',
              'settings_credit_house_subtitle',
              'settings_credit_house_title',
              'settings_credit_skill_icons_subtitle',
              'settings_credit_skill_icons_title',
              'settings_discord',
              'settings_discord_url',
              'settings_wiki',
              'settings_wiki_url',
          }

          for name in obsolete:
              text, count = re.subn(
                  rf'^\s*<string\s+name="{re.escape(name)}"(?:\s+[^>]*)?>.*?</string>\s*\n?',
                  '',
                  text,
                  flags=re.MULTILINE,
              )
              if count > 1:
                  raise SystemExit(f'Unexpected duplicate resource: {name} ({count})')

          text, count = re.subn(
              r'(<string\s+name="settings_source_url"\s+translatable="false">).*?(</string>)',
              r'\1github.com/FreetimeMaker/Idle-Coding\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('settings_source_url was not found exactly once')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup if needed
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/res/values/strings.xml; then
            echo 'No resource cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values/strings.xml
          git commit -m 'Remove obsolete settings strings'
          git push origin HEAD:fix/remove-obsolete-about-links
